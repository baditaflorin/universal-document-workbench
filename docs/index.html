<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Universal document workbench for extraction, OCR, NLP, and conversion." />
    <title>Universal Document Workbench</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #172033;
      }

      body {
        margin: 0;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
      }

      section {
        width: min(860px, 100%);
        border: 1px solid #d7dde8;
        border-radius: 8px;
        background: #ffffff;
        padding: 32px;
        box-shadow: 0 18px 45px rgb(23 32 51 / 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 4.5rem);
        line-height: 1;
      }

      p {
        max-width: 66ch;
        color: #43506a;
        font-size: 1.05rem;
        line-height: 1.6;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }

      a {
        color: #0f766e;
        font-weight: 700;
      }

      .button {
        border: 1px solid #bac4d3;
        border-radius: 8px;
        color: #172033;
        display: inline-flex;
        padding: 10px 14px;
        text-decoration: none;
      }

      .meta {
        border-top: 1px solid #e5e9f0;
        margin-top: 28px;
        padding-top: 16px;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Universal Document Workbench</h1>
        <p>
          Drop files into a GitHub Pages UI, process them with a Docker backend, extract text and metadata,
          OCR scans, detect entities, and export Markdown, DOCX, and EPUB.
        </p>
        <nav aria-label="Project links">
          <a class="button" href="https://github.com/baditaflorin/universal-document-workbench">Star on GitHub</a>
          <a class="button" href="https://www.paypal.com/paypalme/florinbadita">Support via PayPal</a>
        </nav>
        <p class="meta">Version: 0.1.0 · Commit: initial-scaffold</p>
      </section>
    </main>
  </body>
</html>
