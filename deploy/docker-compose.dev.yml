services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VERSION: 0.3.0
        COMMIT: dev
    environment:
      APP_ENV: development
      APP_PUBLIC_ORIGIN: http://localhost:5173,http://127.0.0.1:4173
    ports:
      - "8080:8080"
    read_only: false
    tmpfs: []
