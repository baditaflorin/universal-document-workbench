openapi: 3.1.0
info:
  title: Universal Document Workbench API
  version: 0.2.0
  description: Runtime document extraction, OCR, NLP, and conversion API.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Missing runtime dependency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        "200":
          description: Build version
          content:
            application/json:
              schema:
                type: object
                required: [version, commit]
                properties:
                  version:
                    type: string
                  commit:
                    type: string
  /api/v1/documents:
    post:
      operationId: processDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Processed document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResult"
        "400":
          description: Missing upload or malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Upload too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Processing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    Health:
      type: object
      required: [status, version, commit]
      properties:
        status:
          type: string
        version:
          type: string
        commit:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, what, why, now_what, severity, retryable]
          properties:
            code:
              type: string
            message:
              type: string
            what:
              type: string
            why:
              type: string
            now_what:
              type: string
            severity:
              type: string
            retryable:
              type: boolean
    Confidence:
      type: object
      required: [score, label]
      properties:
        score:
          type: number
          minimum: 0
          maximum: 1
        label:
          type: string
          enum: [low, medium, high]
    Entity:
      type: object
      required: [text, label, start, end, confidence]
      properties:
        text:
          type: string
        label:
          type: string
        start:
          type: integer
        end:
          type: integer
        confidence:
          $ref: "#/components/schemas/Confidence"
    ExportArtifact:
      type: object
      required: [format, filename, mime_type, base64, size_bytes, confidence]
      properties:
        format:
          type: string
          enum: [markdown, docx, epub]
        filename:
          type: string
        mime_type:
          type: string
        base64:
          type: string
        size_bytes:
          type: integer
        confidence:
          $ref: "#/components/schemas/Confidence"
    Diagnostic:
      type: object
      required: [code, severity, message, evidence]
      properties:
        code:
          type: string
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
        evidence:
          type: array
          items:
            type: string
    FieldInference:
      type: object
      required: [name, type, confidence, evidence]
      properties:
        name:
          type: string
        type:
          type: string
        confidence:
          $ref: "#/components/schemas/Confidence"
        evidence:
          type: array
          items:
            type: string
    TableAnalysis:
      type: object
      required: [detected, delimiter, rows, columns, confidence, header_names]
      properties:
        detected:
          type: boolean
        delimiter:
          type: string
        rows:
          type: integer
        columns:
          type: integer
        confidence:
          $ref: "#/components/schemas/Confidence"
        header_names:
          type: array
          items:
            type: string
    Decision:
      type: object
      required: [code, message, confidence, evidence]
      properties:
        code:
          type: string
        message:
          type: string
        confidence:
          $ref: "#/components/schemas/Confidence"
        evidence:
          type: array
          items:
            type: string
    DocumentAnalysis:
      type: object
      required:
        - shape
        - shape_label
        - strategy
        - needs_ocr
        - encrypted
        - empty
        - partial
        - language_hint
        - script_hint
        - page_count
        - text_bytes
        - table
        - fields
        - decisions
        - confidence
        - evidence
        - expected_actions
      properties:
        shape:
          type: string
        shape_label:
          type: string
        strategy:
          type: string
        needs_ocr:
          type: boolean
        encrypted:
          type: boolean
        empty:
          type: boolean
        partial:
          type: boolean
        language_hint:
          type: string
        script_hint:
          type: string
        page_count:
          type: integer
        text_bytes:
          type: integer
        table:
          $ref: "#/components/schemas/TableAnalysis"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldInference"
        decisions:
          type: array
          items:
            $ref: "#/components/schemas/Decision"
        confidence:
          $ref: "#/components/schemas/Confidence"
        evidence:
          type: array
          items:
            type: string
        expected_actions:
          type: array
          items:
            type: string
    Provenance:
      type: object
      required:
        - schema_version
        - source_sha256
        - source_bytes
        - source_filename
        - generated_at
        - app_version
        - commit
        - strategy
        - parameters
        - tool_versions
        - normalizations
        - runtime_only_fields
        - determinism_contract
      properties:
        schema_version:
          type: string
        source_sha256:
          type: string
        source_bytes:
          type: integer
        source_filename:
          type: string
        generated_at:
          type: string
        app_version:
          type: string
        commit:
          type: string
        strategy:
          type: string
        parameters:
          type: object
          additionalProperties:
            type: string
        tool_versions:
          type: object
          additionalProperties:
            type: string
        normalizations:
          type: array
          items:
            type: string
        runtime_only_fields:
          type: array
          items:
            type: string
        determinism_contract:
          type: string
    DocumentResult:
      type: object
      required:
        - id
        - filename
        - mime_type
        - size_bytes
        - text
        - metadata
        - entities
        - people
        - dates
        - outputs
        - tool_versions
        - warnings
        - analysis
        - confidence
        - anomalies
        - provenance
        - processing_ms
      properties:
        id:
          type: string
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
        text:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        people:
          type: array
          items:
            type: string
        dates:
          type: array
          items:
            type: string
        outputs:
          type: array
          items:
            $ref: "#/components/schemas/ExportArtifact"
        tool_versions:
          type: object
          additionalProperties:
            type: string
        warnings:
          type: array
          items:
            type: string
        analysis:
          $ref: "#/components/schemas/DocumentAnalysis"
        confidence:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Confidence"
        anomalies:
          type: array
          items:
            $ref: "#/components/schemas/Diagnostic"
        provenance:
          $ref: "#/components/schemas/Provenance"
        processing_ms:
          type: integer
